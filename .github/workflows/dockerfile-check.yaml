name: dockerfile-check

on:
  pull_request:
    branches: [prod-staging]
    paths:
      - '**/*Dockerfile*'
      - '**/*Containerfile*'
      - '.github/actions/dockerfile-check/**'
      - 'tools/dockerfile-check/**'
      - '.github/workflows/dockerfile-check.yaml'

  workflow_call:
    inputs:
      allow:
        description: Newline-separated prefixes of normalized image references, such as ghcr.io/acme/, that need not be pinned
        type: string
        required: false

permissions:
  contents: read

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dockerfile-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run dockerfile-check
      uses: unikraft-cloud/x/.github/actions/dockerfile-check@prod-staging
      with:
        allow: ${{ inputs.allow }}
