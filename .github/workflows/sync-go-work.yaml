name: sync-go-work

on:
  push:
    branches: ['dependabot/go_modules/**']

  workflow_call:
    inputs:
      goprivate:
        description: Comma-separated list of module path prefixes for GOPRIVATE and GONOSUMDB
        type: string
        required: true
      gh_client_id:
        description: Client ID of a GitHub App to mint a token from, instead of using gh_pat
        type: string
        required: false
    secrets:
      gh_pat:
        description: GitHub PAT used to push the commit and start the pull request checks
        required: false
      gh_private_key:
        description: Private key of the GitHub App in gh_client_id
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      # Direct runs have no inputs, so they use this repository's App.
      APP_CLIENT_ID: ${{ inputs.gh_client_id || vars.TOOLING_APP_CLIENT_ID }}
      HAS_APP_PRIVATE_KEY: ${{ (secrets.gh_private_key || secrets.TOOLING_APP_PRIVATE_KEY) != '' }}

    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.ref, 'refs/heads/dependabot/go_modules/')

    concurrency:
      group: sync-go-work-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Mint a token of the GitHub App
        id: app-token
        if: env.APP_CLIENT_ID != '' && env.HAS_APP_PRIVATE_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.gh_private_key || secrets.TOOLING_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.gh_pat }}

      - name: Setup go
        uses: unikraft-cloud/x/.github/actions/setup-go@prod-staging
        with:
          gh_pat: ${{ steps.app-token.outputs.token || secrets.gh_pat }}
          gh_client_id: ${{ env.APP_CLIENT_ID }}
          gh_private_key: ${{ secrets.gh_private_key || secrets.TOOLING_APP_PRIVATE_KEY }}
          goprivate: ${{ inputs.goprivate }}

      - name: Refresh go.work.sum
        shell: bash
        run: |
          go list -m all >/dev/null

      - name: Push the result
        shell: bash
        run: |
          if git diff --quiet -- go.work.sum; then
            echo "go.work.sum is already in sync"
            exit 0
          fi

          git config user.name 'Unikraft Bot'
          git config user.email 'monkey@unikraft.io'
          git commit --signoff -m 'gomod(deps): Update go.work.sum' -- go.work.sum
          git push
