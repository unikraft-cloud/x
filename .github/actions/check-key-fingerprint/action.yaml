name: check-key-fingerprint

description: >-
  Check that a private key matches a known fingerprint, in the SHA256 form that
  GitHub shows for a GitHub App's private keys.

inputs:
  private-key:
    description: PEM private key, usually a secret. When empty, the check is skipped.
    required: false
  fingerprint:
    description: Expected fingerprint, e.g. SHA256:IAgb...fM4=
    required: true

runs:
  using: composite
  steps:
    # Fork and Dependabot runs get no secrets, so there is nothing to check.
    - name: Check the key fingerprint
      if: ${{ inputs.private-key != '' }}
      shell: bash
      env:
        PRIVATE_KEY: ${{ inputs.private-key }}
        WANT: ${{ inputs.fingerprint }}
      run: |
        if [ -z "${WANT}" ]; then
          echo "::error title=Key fingerprint missing::the private key is set but no fingerprint is given"
          exit 1
        fi
        # create-github-app-token accepts keys stored with literal \n.
        got="SHA256:$(printf '%b\n' "${PRIVATE_KEY}" \
          | openssl pkey -pubout -outform DER \
          | openssl dgst -sha256 -binary \
          | openssl base64 -A)"
        if [ "${got}" != "SHA256:${WANT#SHA256:}" ]; then
          echo "::error title=Key fingerprint mismatch::got ${got}, want SHA256:${WANT#SHA256:}"
          exit 1
        fi
        echo "Key fingerprint matches: ${got}"
