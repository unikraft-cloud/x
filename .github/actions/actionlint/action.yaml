name: actionlint

description: Lint the syntax changes of a GitHub Actions workflow file.

runs:
  using: composite
  steps:
  - name: Check that all workflows are valid
    shell: bash
    run: |
      docker run --rm --volume "$PWD:/repo" --workdir /repo \
        "$(docker build --quiet - <"$GITHUB_ACTION_PATH/actionlint.Dockerfile")" \
        -verbose
