name: setup-go

description: Setup all the tools required for our go actions

inputs:
  gh_pat:
    description: GitHub PAT for accessing private repositories
    required: false
  goprivate:
    description: Comma-separated list of module path prefixes for GOPRIVATE and GONOSUMDB
    required: false
  cache-key-prefix:
    description: Prefix of the Go cache key. When empty, the job ID is used.
    required: false
    default: ''
  cache-key-suffix:
    description: Suffix of the Go cache key. Use a unique value to save a new cache each run.
    required: false
    default: ''
  cache-save:
    description: Set to 'false' to restore the Go cache but not save it.
    required: false
    default: 'true'
  cache-paths:
    description: Newline-separated list of more paths to put in the Go cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Auto-gc prunes .git/shallow in the cached module VCS repos out from under
    # go's `git fetch --unshallow`, breaking private module resolution.
    - name: Disable git auto-gc
      shell: bash
      run: |
        git config --global gc.auto 0

    - name: Login to GitHub
      if: ${{ inputs.gh_pat != '' }}
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ inputs.gh_pat }}@github.com/".insteadOf "https://github.com/"

    - name: Detect Go version file
      id: goversionfile
      shell: bash
      run: |
        if [ -f go.work ]; then
          echo "file=go.work" >>"$GITHUB_OUTPUT"
        else
          echo "file=go.mod" >>"$GITHUB_OUTPUT"
        fi

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ steps.goversionfile.outputs.file }}
        cache: false

    - name: Set Go variables
      id: goenv
      shell: bash
      run: |
        {
          echo "cache=$(go env GOCACHE)"
          echo "modcache=$(go env GOMODCACHE)"
          echo "mod=$(go env GOMOD)"
          echo "version=$(go env GOVERSION)"
        } >>"$GITHUB_OUTPUT"

    - name: Setup GOPRIVATE
      if: ${{ inputs.goprivate != '' }}
      shell: bash
      run: |
        echo "GOPRIVATE=${{ inputs.goprivate }}" >> "$GITHUB_ENV"
        echo "GONOSUMDB=${{ inputs.goprivate }}" >> "$GITHUB_ENV"

    - name: Set Go cache key
      id: gocache
      shell: bash
      env:
        PREFIX: ${{ inputs.cache-key-prefix || github.job }}
        SUFFIX: ${{ inputs.cache-key-suffix }}
      run: |
        _BASE="${PREFIX}-${{ runner.os }}-${{ steps.goenv.outputs.version }}-"
        echo "restore=${_BASE}" >>"$GITHUB_OUTPUT"
        echo "key=${_BASE}${{ hashFiles(steps.goenv.outputs.mod) }}${SUFFIX:+-${SUFFIX}}" >>"$GITHUB_OUTPUT"

    - name: Go caches
      if: ${{ inputs.cache-save != 'false' }}
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.goenv.outputs.cache }}
          ${{ steps.goenv.outputs.modcache }}
          ${{ inputs.cache-paths }}
        key: ${{ steps.gocache.outputs.key }}
        restore-keys: |
          ${{ steps.gocache.outputs.restore }}

    - name: Restore Go caches
      if: ${{ inputs.cache-save == 'false' }}
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.goenv.outputs.cache }}
          ${{ steps.goenv.outputs.modcache }}
          ${{ inputs.cache-paths }}
        key: ${{ steps.gocache.outputs.key }}
        restore-keys: |
          ${{ steps.gocache.outputs.restore }}

    - name: Setup Task
      uses: go-task/setup-task@v2

    - name: Enable remote Taskfiles experiment
      shell: bash
      run: |
        echo TASK_X_REMOTE_TASKFILES=1 >>"$GITHUB_ENV"

    # Check that we can resolve remote taskfiles, populate cache and force
    # using that cache instead of the network
    - name: Check Taskfile
      shell: bash
      run: |
        task --verbose --download --yes --list-all
        echo TASK_OFFLINE=1 >>"$GITHUB_ENV"
