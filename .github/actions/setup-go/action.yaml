name: setup-go

description: Setup all the tools required for our go actions

inputs:
  gh_pat:
    description: GitHub token for accessing private repositories
    required: false
  gh_client_id:
    description: Client ID of a GitHub App to mint a token from, instead of using gh_pat
    required: false
  gh_private_key:
    description: Private key of the GitHub App in gh_client_id
    required: false
  goprivate:
    description: Comma-separated list of module path prefixes for GOPRIVATE and GONOSUMDB
    required: false
  cache-key-prefix:
    description: Prefix of the Go cache key. When empty, the job ID is used.
    required: false
    default: ''
  cache-key-suffix:
    description: Suffix of the Go cache key. Use a unique value to save a new cache each run.
    required: false
    default: ''
  cache-save:
    description: Set to 'false' to restore the Go cache but not save it.
    required: false
    default: 'true'
  cache-paths:
    description: Newline-separated list of more paths to put in the Go cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Auto-gc prunes .git/shallow in the cached module VCS repos out from under
    # go's `git fetch --unshallow`, breaking private module resolution.
    - name: Disable git auto-gc
      shell: bash
      run: |
        git config --global gc.auto 0

    # Private modules live in other repositories, so this isn't scoped to this one.
    - name: Mint a token of the GitHub App
      id: app-token
      if: ${{ inputs.gh_client_id != '' && inputs.gh_private_key != '' }}
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{ inputs.gh_client_id }}
        private-key: ${{ inputs.gh_private_key }}
        owner: ${{ github.repository_owner }}
        permission-contents: read

    - name: Login to GitHub
      if: ${{ steps.app-token.outputs.token != '' || inputs.gh_pat != '' }}
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token || inputs.gh_pat }}
      run: |
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

    - name: Detect Go version file
      id: goversionfile
      shell: bash
      run: |
        if [ -f go.work ]; then
          echo "file=go.work" >>"$GITHUB_OUTPUT"
        else
          echo "file=go.mod" >>"$GITHUB_OUTPUT"
        fi

    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: ${{ steps.goversionfile.outputs.file }}
        cache: false

    - name: Set Go variables
      id: goenv
      shell: bash
      run: |
        {
          echo "cache=$(go env GOCACHE)"
          echo "modcache=$(go env GOMODCACHE)"
          echo "mod=$(go env GOMOD)"
          echo "version=$(go env GOVERSION)"
        } >>"$GITHUB_OUTPUT"

    - name: Setup GOPRIVATE
      if: ${{ inputs.goprivate != '' }}
      shell: bash
      run: |
        echo "GOPRIVATE=${{ inputs.goprivate }}" >> "$GITHUB_ENV"
        echo "GONOSUMDB=${{ inputs.goprivate }}" >> "$GITHUB_ENV"

    - name: Set Go cache key
      id: gocache
      shell: bash
      env:
        PREFIX: ${{ inputs.cache-key-prefix || github.job }}
        SUFFIX: ${{ inputs.cache-key-suffix }}
      run: |
        _BASE="${PREFIX}-${{ runner.os }}-${{ steps.goenv.outputs.version }}-"
        echo "restore=${_BASE}" >>"$GITHUB_OUTPUT"
        echo "key=${_BASE}${{ hashFiles(steps.goenv.outputs.mod) }}${SUFFIX:+-${SUFFIX}}" >>"$GITHUB_OUTPUT"

    - name: Go caches
      if: ${{ inputs.cache-save != 'false' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.goenv.outputs.cache }}
          ${{ steps.goenv.outputs.modcache }}
          ${{ inputs.cache-paths }}
        key: ${{ steps.gocache.outputs.key }}
        restore-keys: |
          ${{ steps.gocache.outputs.restore }}

    - name: Restore Go caches
      if: ${{ inputs.cache-save == 'false' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.goenv.outputs.cache }}
          ${{ steps.goenv.outputs.modcache }}
          ${{ inputs.cache-paths }}
        key: ${{ steps.gocache.outputs.key }}
        restore-keys: |
          ${{ steps.gocache.outputs.restore }}

    - name: Setup Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

    # Check that we can resolve remote taskfiles, populate cache and force
    # using that cache instead of the network
    - name: Check Taskfile
      shell: bash
      run: |
        task --verbose --download --yes --list-all
        echo TASK_OFFLINE=1 >>"$GITHUB_ENV"
