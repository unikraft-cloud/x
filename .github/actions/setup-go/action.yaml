name: setup-go

description: Setup all the tools required for our go actions

inputs:
  gh_pat:
    description: GitHub PAT for accessing private repositories
    required: false
  goprivate:
    description: Comma-separated list of module path prefixes for GOPRIVATE and GONOSUMDB
    required: false
  cache_save:
    description: When to save the Go caches, `always` or `push` (only on a push to the default branch)
    required: false
    default: always

runs:
  using: composite
  steps:
    # Auto-gc prunes .git/shallow in the cached module VCS repos out from under
    # go's `git fetch --unshallow`, breaking private module resolution.
    - name: Disable git auto-gc
      shell: bash
      run: |
        git config --global gc.auto 0

    - name: Login to GitHub
      if: ${{ inputs.gh_pat != '' }}
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ inputs.gh_pat }}@github.com/".insteadOf "https://github.com/"

    - name: Detect Go version file
      id: goversionfile
      shell: bash
      run: |
        if [ -f go.work ]; then
          echo "file=go.work" >>"$GITHUB_OUTPUT"
        else
          echo "file=go.mod" >>"$GITHUB_OUTPUT"
        fi

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ steps.goversionfile.outputs.file }}
        cache: false

    - name: Set Go variables
      id: goenv
      shell: bash
      run: |
        {
          echo "cache=$(go env GOCACHE)"
          echo "modcache=$(go env GOMODCACHE)"
          echo "version=$(go env GOVERSION)"
        } >>"$GITHUB_OUTPUT"

    - name: Setup GOPRIVATE
      if: ${{ inputs.goprivate != '' }}
      shell: bash
      run: |
        echo "GOPRIVATE=${{ inputs.goprivate }}" >> "$GITHUB_ENV"
        echo "GONOSUMDB=${{ inputs.goprivate }}" >> "$GITHUB_ENV"

    # All jobs share one module cache, but each job has its own build cache because its flags differ.
    - name: Select the Go cache action
      id: cacheaction
      shell: bash
      env:
        CACHE_SAVE: ${{ inputs.cache_save }}
        IS_DEFAULT_PUSH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        case "$CACHE_SAVE" in
          always) save=true ;;
          push) save=$IS_DEFAULT_PUSH ;;
          *) echo "::error::cache_save must be always or push, not $CACHE_SAVE"; exit 1 ;;
        esac
        echo "save=$save" >>"$GITHUB_OUTPUT"

    - name: Go module cache
      if: ${{ steps.cacheaction.outputs.save == 'true' }}
      uses: actions/cache@v5
      with:
        path: ${{ steps.goenv.outputs.modcache }}
        key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-

    - name: Go module cache (restore only)
      if: ${{ steps.cacheaction.outputs.save != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.goenv.outputs.modcache }}
        key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-

    - name: Go build cache
      if: ${{ steps.cacheaction.outputs.save == 'true' }}
      uses: actions/cache@v5
      with:
        path: ${{ steps.goenv.outputs.cache }}
        key: gobuild-${{ github.job }}-${{ runner.os }}-${{ steps.goenv.outputs.version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gobuild-${{ github.job }}-${{ runner.os }}-${{ steps.goenv.outputs.version }}-

    - name: Go build cache (restore only)
      if: ${{ steps.cacheaction.outputs.save != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.goenv.outputs.cache }}
        key: gobuild-${{ github.job }}-${{ runner.os }}-${{ steps.goenv.outputs.version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gobuild-${{ github.job }}-${{ runner.os }}-${{ steps.goenv.outputs.version }}-

    - name: Setup Task
      uses: go-task/setup-task@v2

    - name: Enable remote Taskfiles experiment
      shell: bash
      run: |
        echo TASK_X_REMOTE_TASKFILES=1 >>"$GITHUB_ENV"

    # Check that we can resolve remote taskfiles, populate cache and force
    # using that cache instead of the network
    - name: Check Taskfile
      shell: bash
      run: |
        task --verbose --download --yes --list-all
        echo TASK_OFFLINE=1 >>"$GITHUB_ENV"
