version: 2

updates:
# Dependabot does not support Go workspaces, so it visits each module on its
# own.  The glob keeps the directory list in step with the tree.  See [0].
# [0]: https://github.com/dependabot/dependabot-core/issues/6012
- package-ecosystem: gomod
  directories:
  - /
  - '**/*'
  schedule:
    interval: weekly
    day: sunday
    time: '09:00'
  commit-message:
    prefix: gomod # Prefix messages with
    include: scope # List all updated dependencies
  ignore:
    # Intra-repo modules resolve through the workspace, so the tree is the
    # source of truth for their pseudo-versions.
    - dependency-name: unikraft.com/x/*
  groups:
    go-deps:
      applies-to: version-updates
      patterns:
      - '*'
    go-security:
      applies-to: security-updates
      patterns:
      - '*'

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: sunday
    time: '09:00'
  groups:
    github-deps:
      applies-to: version-updates
      patterns:
      - '*'
    github-security:
      applies-to: security-updates
      patterns:
      - '*'

- package-ecosystem: npm
  directory: /.github/actions/check-pr
  schedule:
    interval: weekly
    day: sunday
    time: '09:00'
  groups:
    npm-deps:
      applies-to: version-updates
      patterns:
      - '*'
    npm-security:
      applies-to: security-updates
      patterns:
      - '*'
