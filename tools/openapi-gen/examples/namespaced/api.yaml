# Example spec for --namespace-import-path: the Org.Common namespace is
# generated once into common/v1, and machines/v1 imports it.
openapi: 3.0.3
info:
  title: Namespaced Example API
  version: "1.0.0"
paths:
  /machines/{id}:
    get:
      operationId: GetMachine
      tags: [Machines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Org.Common.Status'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machines.Machine'
        default:
          description: default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machines.Machine'
components:
  schemas:
    Org.Common.Status:
      type: string
      enum: [running, stopped]
    Org.Common.Label:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
    Org.Common.Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Machines.Machine:
      type: object
      required: [id]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/Org.Common.Status'
        phase:
          $ref: '#/components/schemas/Machines.Phase'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Org.Common.Label'
        lastError:
          $ref: '#/components/schemas/Org.Common.Error'
        labelsByKey:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Org.Common.Label'
    Machines.Phase:
      $ref: '#/components/schemas/Org.Common.Status'
