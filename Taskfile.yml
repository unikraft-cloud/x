# https://taskfile.dev
version: 3

includes:
  go:
    taskfile: ./Taskfile.go.yml

tasks:
  forone:
    requires: { vars: [module, gotask] }
    # NOTE: this is a hack to work around the fact that go-task doesn't
    # allow passing the 'dir' setting to child tasks:
    # https://github.com/go-task/task/issues/585
    cmd: task -d {{.module}} -t Taskfile.go.yml -s {{.gotask}} {{with .package}}package={{.}}{{end}}

  forall:
    requires: { vars: [gotask] }
    vars:
      modules:
        # List workspace modules, excluding the root module (which exists
        # only to host go.mod replace directives for tools).
        sh: go list -m -f '{{`{{if ne .Path "unikraft.com/x"}}{{.Dir}}{{end}}`}}' | grep -v '^$'
    cmds:
    - for: { var: modules }
      task: forone
      vars:
        module: '{{.ITEM}}'
        gotask: '{{.gotask}}'

  protoc-gen-go-struct:
  - task: go:build
    vars:
      package: ./tools/protoc-gen-go-struct

  imgtool:
  - task: go:build
    vars:
      package: ./tools/imgtool

  license-check:
  - task: go:build
    vars:
      package: ./tools/license-check

  tools:
  - task: protoc-gen-go-struct
  - task: imgtool
  - task: license-check

  openapi-gen-examples-check:
    desc: "Verify tools/openapi-gen/examples is regenerated from api.yaml"
    dir: tools/openapi-gen/examples
    cmds:
    - go generate ./...
    - git add -A -- .
    - git diff --cached --exit-code -- .

  kraftfile-schema-check:
    desc: "Verify kraftfile/schema.json is regenerated from the Go spec"
    dir: kraftfile
    cmds:
    - go generate ./...
    - git add -A -- .
    - git diff --cached --exit-code -- .

  # ci tasks

  ci/check:
  - task: forall
    vars: { gotask: static-check }
  - task: openapi-gen-examples-check
  - task: kraftfile-schema-check
  - task: ci/check-wasm

  ci/check-wasm:
    desc: "Verify the modules the browser CLI needs still build for js/wasm"
    vars:
      # Modules that must keep building for js/wasm.  The rest reach for a
      # daemon, a terminal or a syscall the js runtime does not have.
      # This list is alphabetical and should not be reordered.
      modules:
      - ./colors
      - ./filters
      - ./fingerprint
      - ./guesstermwidth
      - ./io
      - ./joinerrgroup
      - ./kingkong
      - ./kraftfile
      - ./log
      - ./ptr
      - ./ringbuffer
      - ./sanitize
      - ./signal
      - ./stdio
      - ./text
      - ./version
    cmds:
    - for: { var: modules }
      task: forone
      vars:
        module: '{{.ITEM}}'
        gotask: wasm-check
    # Only the reference grammar of image-spec builds for js; its backends
    # reach for containerd's content store.
    - task: forone
      vars:
        module: ./image-spec
        gotask: wasm-check
        package: ./uri

  ci/test:
  - task: forall
    vars: { gotask: test }

  ci/build:
  - task: tools
